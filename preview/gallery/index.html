<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation Gallery</title>
    <style>
      :root { color-scheme: dark; --bg: #0a0c10; --panel: #12161d; --line: #232a35; --text: #e8eaee; --muted: #8b94a3; --accent: #60a5fa; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, 'Segoe UI', sans-serif; }
      header { position: sticky; top: 0; z-index: 5; background: rgba(10,12,16,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      h1 { font-size: 17px; margin: 0 12px 0 0; }
      input { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 7px 10px; width: 220px; }
      .chip { background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 99px; padding: 5px 11px; cursor: pointer; font: inherit; }
      .chip.on { color: #fff; border-color: var(--accent); background: #1d2a40; }
      main { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; }
      .card:hover { border-color: var(--accent); }
      .thumb { aspect-ratio: 16 / 9; background: #000; }
      .meta { padding: 9px 12px; display: flex; justify-content: space-between; gap: 8px; }
      .meta code { color: var(--text); font-size: 13px; }
      .meta span { color: var(--muted); font-size: 12px; }
      .modal { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; padding: 24px; }
      .modal-inner { width: min(1280px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
      .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
      pre { margin: 0; padding: 14px 16px; border-top: 1px solid var(--line); color: #b9c2d0; font-size: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
